name: Build worker image

# Builds the transcode worker image on GitHub's runners and pushes it to the
# Azure Container Registry, so nothing large travels over a local connection.
# Run manually from the Actions tab (Run workflow), or it auto-runs when the
# worker/shared packages change.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/worker/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/build-worker.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/vp-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
