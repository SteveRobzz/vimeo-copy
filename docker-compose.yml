# Local dev dependencies only (Postgres + Redis + MinIO).
# Prod uses Railway-managed Postgres/Redis + Cloudflare R2; this mirrors them locally.
# MinIO is S3-compatible, so the exact same storage code runs locally and against R2.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vp
      POSTGRES_PASSWORD: vp
      POSTGRES_DB: vp
    ports:
      - "5432:5432"
    volumes:
      - vp_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - vp_redisdata:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
      # Allow browser (localhost:3000) to PUT chunks straight to MinIO via presigned URLs.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console (http://localhost:9001, minio/minio12345)
    volumes:
      - vp_miniodata:/data

  # One-shot: create the media bucket, then exit.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio12345; do echo 'waiting for minio...'; sleep 1; done;
      mc mb --ignore-existing local/vp-media;
      echo 'bucket vp-media ready';
      exit 0;
      "

volumes:
  vp_pgdata:
  vp_redisdata:
  vp_miniodata:
