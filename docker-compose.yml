# Local dev dependencies only (Postgres + Redis).
# Prod uses Railway-managed Postgres/Redis; this just mirrors them locally.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vp
      POSTGRES_PASSWORD: vp
      POSTGRES_DB: vp
    ports:
      - "5432:5432"
    volumes:
      - vp_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - vp_redisdata:/data

volumes:
  vp_pgdata:
  vp_redisdata:
